[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarpod-pcle"
version = "0.2.0"
description = "SmarPod pCLE capture, data collection, mosaicking and visual-servoing client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.9,<5", "mss>=9,<11"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
smarpod-pcle = "smarpod_pcle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
